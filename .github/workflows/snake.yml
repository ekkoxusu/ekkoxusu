# 每日生成贪吃蛇动画（吃掉提交热力图），产出 dist/github-snake*.svg
name: Generate Snake

on:
  schedule:
    - cron: "17 2 * * *" # 每天一次，避开整点高峰
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore: regenerate snake [skip ci]" || echo "nothing to commit"
          git push
